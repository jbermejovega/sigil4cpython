[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigil4cpython"
version = "0.1.1"
description = "Public SIGIL4PY compatibility layer and typed codebook validator"
readme = "README.rst"
requires-python = ">=3.9"
authors = [
  { name = "Jara Juana Bermejo Vega" }
]
license = { text = "Apache-2.0" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C",
  "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Repository = "https://github.com/jbermejovega/sigil4cpython"
"Public Interface" = "https://github.com/jbermejovega/sigil4cpython/blob/main/SIGIL_PUBLIC_INTERFACE.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sigil4py = "sigil4py.cli:main"
sigil4py-check = "sigil4py.cli:main"
