name: SIGIL4CPython primitive typed publication gate\n\non:\n  pull_request:\n    branches:\n      - main\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  publication-codebook:\n    name: Validate primitive typed publication codebook\n    runs-on: ubuntu-latest\n    timeout-minutes: 10\n    steps:\n      - name: Checkout\n        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1\n        with:\n          persist-credentials: false\n\n      - name: Set up Python\n        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0\n        with:\n          python-version: '3.11'\n\n      - name: Compile public primitive\n        run: python -m compileall -q Lib/sigil4cpython/primitive_typed_qquapp_ruleset_codebook.py\n\n      - name: Run dependency-free publication tests\n        run: |\n          python - <<'PY'\n          import runpy\n          import sys\n\n          sys.path.append('Lib')\n          sys.argv = [\n              'Lib/test/test_sigil4cpython_primitive_typed_qquapp_ruleset_codebook.py',\n              '-v',\n          ]\n          runpy.run_path(\n              'Lib/test/test_sigil4cpython_primitive_typed_qquapp_ruleset_codebook.py',\n              run_name='__main__',\n          )\n          PY\n\n      - name: Validate publication manifest\n        run: |\n          python - <<'PY'\n          import json\n          from pathlib import Path\n\n          payload = json.loads(\n              Path('.sigil/primitive-typed-qquapp-ruleset-codebook-v1.json')\n              .read_text(encoding='utf-8')\n          )\n          assert payload['schema_id'] == 'SIGIL4CPYTHON_PRIMITIVE_TYPED_QQUAPP_RULESET_CODEBOOK_V1'\n          assert payload['target_branches'] == ['main']\n          assert payload['bypass_list'] == []\n          assert payload['private_payload_embedded'] is False\n          assert payload['cpython_private_api_required'] is False\n          assert payload['github_ruleset_is_semantic_authority'] is False\n          assert payload['github_ruleset_mutation_executed'] is False\n          assert payload['required_status_checks'] == [\n              'Validate primitive typed publication codebook'\n          ]\n          law = payload['type_law']\n          assert all(\n              law[key] is True\n              for key in (\n                  'plural_typed',\n                  'resource_typed',\n                  'relation_typed',\n                  'quno_typed',\n              )\n          )\n          print('primitive typed publication manifest validated')\n          PY\n\n      - name: Boundary notice\n        run: |\n          echo 'Publication codebook is metadata/governance only.'\n          echo 'No private SIGILBOOK payload is copied.'\n          echo 'No CPython interpreter semantics or GitHub ruleset are mutated.'\n