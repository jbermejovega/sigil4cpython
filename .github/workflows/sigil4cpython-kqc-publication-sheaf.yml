name: SIGIL4CPython KQC publication sheaf

on:
  workflow_dispatch:
  push:
    paths:
      - 'Lib/sigil4cpython/kqc_sheaf.py'
      - 'Lib/sigil4cpython/__init__.py'
      - 'Lib/test/test_sigil4cpython_kqc_sheaf.py'
      - 'Tools/sigil4cpython/**'
      - 'Misc/sigil4cpython/kqc_publication_sheaf_v1.json'
      - 'Misc/sigil4cpython/STRIKK_KQC_PUBLICATION_SHEAF_V1.md'
      - 'Doc/library/sigil4cpython_kqc_sheaf.rst'
      - '.github/workflows/sigil4cpython-kqc-publication-sheaf.yml'
  pull_request:
    paths:
      - 'Lib/sigil4cpython/kqc_sheaf.py'
      - 'Lib/sigil4cpython/__init__.py'
      - 'Lib/test/test_sigil4cpython_kqc_sheaf.py'
      - 'Tools/sigil4cpython/**'
      - 'Misc/sigil4cpython/kqc_publication_sheaf_v1.json'
      - 'Misc/sigil4cpython/STRIKK_KQC_PUBLICATION_SHEAF_V1.md'
      - 'Doc/library/sigil4cpython_kqc_sheaf.rst'
      - '.github/workflows/sigil4cpython-kqc-publication-sheaf.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate dependency-free and Pydantika sheaf layers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Install tooling-only dependency
        run: python -m pip install 'pydantic>=2.13,<3'

      - name: Compile typed surfaces
        run: |
          python -m compileall -q Lib/sigil4cpython
          python -m compileall -q Tools/sigil4cpython

      - name: Run dependency-free contract tests
        id: dependency_free
        continue-on-error: true
        run: |
          python - <<'PY' > kqc-dependency-free.log 2>&1
          import runpy
          import sys

          # Append only the experimental package tree after the runner stdlib has
          # initialized. Running the test file directly avoids unittest discovery
          # assumptions tied to this CPython source checkout.
          sys.path.append('Lib')
          sys.argv = ['Lib/test/test_sigil4cpython_kqc_sheaf.py', '-v']
          runpy.run_path(
              'Lib/test/test_sigil4cpython_kqc_sheaf.py',
              run_name='__main__',
          )
          PY
          cat kqc-dependency-free.log

      - name: Run Pydantika and DisCoPy-plan tests
        id: pydantika
        continue-on-error: true
        run: |
          python Tools/sigil4cpython/test_kqc_publication_models.py -v \
            > kqc-pydantika.log 2>&1
          cat kqc-pydantika.log

      - name: Parse source-bound JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('Misc/sigil4cpython/kqc_publication_sheaf_v1.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          assert payload['strikk_type'] == 'STRIKK::KQC_PUBLICATION_SHEAF'
          assert payload['publication_hops'][1]['target_repository'] == 'python/cpython'
          assert payload['publication_hops'][1]['authority'] == 'PLAN_ONLY'
          assert payload['publication_hops'][1]['direct_upstream_write'] is False
          print('source-bound publication schema parsed')
          PY

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: kqc-publication-sheaf-test-logs
          path: |
            kqc-dependency-free.log
            kqc-pydantika.log
          if-no-files-found: warn

      - name: Fail on test obstruction
        if: steps.dependency_free.outcome != 'success' || steps.pydantika.outcome != 'success'
        env:
          DEPENDENCY_FREE_OUTCOME: ${{ steps.dependency_free.outcome }}
          PYDANTIKA_OUTCOME: ${{ steps.pydantika.outcome }}
        run: |
          echo 'KQC publication sheaf tests retained an obstruction.'
          test "$DEPENDENCY_FREE_OUTCOME" = 'success'
          test "$PYDANTIKA_OUTCOME" = 'success'

      - name: Authority boundary notice
        run: |
          echo 'This workflow validates finite metadata and proof obligations only.'
          echo 'It does not copy sigilbook files or write to python/cpython.'
          echo 'Pydantic is tooling-only and is not introduced as a stdlib dependency.'
